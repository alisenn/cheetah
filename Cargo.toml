[package]
name = "cheetah"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.37.1"
wry = "0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSError"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["block2", "WKContentRuleList", "WKContentRuleListStore", "WKWebView", "WKWebViewConfiguration", "WKUserContentController"] }
