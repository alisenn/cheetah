name: bench

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [cheetah, chrome, safari]
    steps:
      - uses: actions/checkout@v4
      - name: Build cheetah
        if: matrix.browser == 'cheetah'
        run: cargo build --release
      - name: Run benchmark
        run: python3 bench/bench.py ${{ matrix.browser }}
